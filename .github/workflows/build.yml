name: Build Windows 🪟

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'


      # ============================================================
      # 7-Zip
      # ============================================================

      - name: Install 7-Zip
        shell: powershell
        run: |
          choco install 7zip -y

          if ($LASTEXITCODE -ne 0) {
              Write-Error "No se pudo instalar 7-Zip"
              exit $LASTEXITCODE
          }


      # ============================================================
      # Extraer libmpv
      # ============================================================

      - name: Extract libmpv
        shell: powershell
        run: |
          $mpvDir = "$env:GITHUB_WORKSPACE\3rdparty\mpv"
          $archive = Join-Path $mpvDir "libmpv-2.zip.001"

          Write-Host "Directorio mpv:"
          Get-ChildItem $mpvDir

          if (!(Test-Path $archive)) {
              Write-Error "No se encontró:"
              Write-Error $archive
              exit 1
          }

          Write-Host "Extrayendo libmpv..."

          & "7z.exe" x `
            $archive `
            "-o$mpvDir" `
            -y

          if ($LASTEXITCODE -ne 0) {
              Write-Error "7-Zip terminó con código $LASTEXITCODE"
              exit $LASTEXITCODE
          }

          Write-Host "Contenido después de extraer:"
          Get-ChildItem $mpvDir -Recurse


      # ============================================================
      # Cache de Qt
      # ============================================================

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\Qt
          key: qt-6.11.2-windows-2025-msvc2022_64-qtsvg


      # ============================================================
      # Instalar Qt con aqtinstall
      # ============================================================

      - name: Install Qt via aqtinstall
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          pip install git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head

          aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 `
            --outputdir "${{ github.workspace }}\Qt" `
            --modules qtsvg


      # ============================================================
      # Localizar Qt6Config.cmake
      # ============================================================

      - name: Locate Qt6
        shell: powershell
        run: |
          $qtDir = "$env:GITHUB_WORKSPACE\Qt"

          Write-Host "Buscando Qt6Config.cmake en:"
          Write-Host $qtDir

          $qtConfig = Get-ChildItem `
            -Path $qtDir `
            -Filter "Qt6Config.cmake" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$qtConfig) {
              Write-Error "No se encontró Qt6Config.cmake"
              Write-Host "Contenido de Qt:"

              if (Test-Path $qtDir) {
                  Get-ChildItem $qtDir -Recurse
              }

              exit 1
          }

          $qtCmakeDir = $qtConfig.DirectoryName

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Qt6 encontrado"
          Write-Host "========================================"
          Write-Host $qtCmakeDir
          Write-Host ""

          "QT6_DIR=$qtCmakeDir" >> $env:GITHUB_ENV


      # ============================================================
      # Verificar Qt
      # ============================================================

      - name: Verify Qt
        shell: powershell
        run: |
          Write-Host "QT6_DIR:"
          Write-Host $env:QT6_DIR

          if (!(Test-Path "$env:QT6_DIR\Qt6Config.cmake")) {
              Write-Error "Qt6Config.cmake no existe"
              exit 1
          }

          Write-Host ""
          Write-Host "Qt6Config.cmake encontrado correctamente."


      # ============================================================
      # Verificar generador de Visual Studio
      # ============================================================

      - name: Verify CMake Generator
        shell: powershell
        run: |
          Write-Host "Generadores disponibles:"
          cmake --help | Select-String "Visual Studio"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "No se pudieron consultar los generadores de CMake."
              exit $LASTEXITCODE
          }


      # ============================================================
      # Configurar CMake
      # ============================================================

      - name: Configure CMake
        shell: powershell
        run: |
          Write-Host "Configurando CMake..."

          cmake -S . -B build `
            -G "Visual Studio 18 2026" `
            "-DQt6_DIR=$env:QT6_DIR" `
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\build\install"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falló la configuración de CMake"
              exit $LASTEXITCODE
          }


      # ============================================================
      # Build
      # ============================================================

      - name: Build Release
        shell: powershell
        run: |
          Write-Host "Compilando proyecto en Release..."

          cmake --build build --config Release --parallel

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falló la compilación."
              exit $LASTEXITCODE
          }


      # ============================================================
      # Install
      # ============================================================

      - name: Install Release
        shell: powershell
        run: |
          Write-Host "Instalando proyecto..."

          cmake --install build --config Release

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falló la instalación."
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Contenido de build/install:"
          Get-ChildItem "${{ github.workspace }}\build\install" -Recurse


      # ============================================================
      # CPack
      # ============================================================

      - name: Package with CPack
        shell: powershell
        run: |
          Write-Host "Generando paquetes con CPack..."

          cpack `
            --config "${{ github.workspace }}\build\CPackConfig.cmake" `
            -C Release

          if ($LASTEXITCODE -ne 0) {
              Write-Error "CPack falló."
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Artefactos generados"
          Write-Host "========================================"

          $artifacts = Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Filter "iptvPlus-*"

          if ($artifacts.Count -eq 0) {
              Write-Error "CPack no generó ningún artefacto."
              exit 1
          }

          $artifacts | ForEach-Object {
              Write-Host $_.FullName
          }


      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iptvPlus-*.exe
            iptvPlus-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}