name: Build Windows 🪟

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================================
      # System Dependencies
      # ============================================================

      - name: Install System Dependencies
        shell: powershell
        run: |
          Write-Host "Instalando 7-Zip y NSIS..."

          choco install 7zip nsis -y

          if ($LASTEXITCODE -ne 0) {
              Write-Error "No se pudieron instalar las dependencias del sistema."
              exit $LASTEXITCODE
          }

      # ============================================================
      # vcpkg
      # ============================================================

      - name: Setup vcpkg
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Instalando / Actualizando vcpkg"
          Write-Host "========================================"

          if (!(Test-Path "C:\vcpkg")) {
              git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "No se pudo clonar vcpkg."
                  exit $LASTEXITCODE
              }
          } else {
              Write-Host "vcpkg ya existe en C:\vcpkg. Actualizando repositorio..."
              Set-Location C:\vcpkg
              git fetch origin
              git checkout master
              git pull origin master
          }

          Set-Location C:\vcpkg

          .\bootstrap-vcpkg.bat

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falló bootstrap-vcpkg."
              exit $LASTEXITCODE
          }

          .\vcpkg.exe version

      # ============================================================
      # vcpkg triplet
      # ============================================================

      - name: Install vcpkg Dependencies
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Instalando dependencias vcpkg"
          Write-Host "========================================"

          $triplet = "x64-windows-static-md"

          Write-Host "Triplet: $triplet"

          C:\vcpkg\vcpkg.exe install `
            libtorrent `
            openssl `
            boost `
            --triplet=$triplet

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falló la instalación de dependencias vcpkg."
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Dependencias instaladas correctamente."

      # ============================================================
      # Extraer libmpv
      # ============================================================

      - name: Extract libmpv
        shell: powershell
        run: |
          $mpvDir = "$env:GITHUB_WORKSPACE\3rdparty\mpv"
          $archive = Join-Path $mpvDir "libmpv-2.zip.001"

          Write-Host "========================================"
          Write-Host "Preparando libmpv"
          Write-Host "========================================"

          if (!(Test-Path $mpvDir)) {
              Write-Error "No existe el directorio:"
              Write-Error $mpvDir
              exit 1
          }

          Write-Host "Contenido inicial:"
          Get-ChildItem $mpvDir

          if (!(Test-Path $archive)) {
              Write-Error "No se encontró:"
              Write-Error $archive
              exit 1
          }

          Write-Host ""
          Write-Host "Extrayendo libmpv..."

          & "7z.exe" x `
            $archive `
            "-o$mpvDir" `
            -y

          if ($LASTEXITCODE -ne 0) {
              Write-Error "7-Zip terminó con código $LASTEXITCODE"
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Contenido después de extraer:"
          Get-ChildItem $mpvDir -Recurse

      # ============================================================
      # Cache Qt
      # ============================================================

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\Qt
          key: qt-6.11.2-windows-msvc2022-x64

      # ============================================================
      # Instalar Qt
      # ============================================================

      - name: Install Qt via aqtinstall
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          Write-Host "Instalando Qt 6.11.2..."

          python -m pip install --upgrade pip

          pip install git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head

          aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 `
            --outputdir "${{ github.workspace }}\Qt"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falló la instalación de Qt."
              exit $LASTEXITCODE
          }

      # ============================================================
      # Localizar Qt6Config.cmake
      # ============================================================

      - name: Locate Qt6
        shell: powershell
        run: |
          $qtDir = "$env:GITHUB_WORKSPACE\Qt"

          Write-Host "Buscando Qt6Config.cmake..."
          Write-Host "Directorio: $qtDir"

          $qtConfig = Get-ChildItem `
            -Path $qtDir `
            -Filter "Qt6Config.cmake" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$qtConfig) {
              Write-Error "No se encontró Qt6Config.cmake"

              if (Test-Path $qtDir) {
                  Get-ChildItem $qtDir -Recurse
              }

              exit 1
          }

          $qtCmakeDir = $qtConfig.DirectoryName

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Qt6 encontrado"
          Write-Host "========================================"
          Write-Host $qtCmakeDir

          "QT6_DIR=$qtCmakeDir" >> $env:GITHUB_ENV

      # ============================================================
      # Verificar Qt
      # ============================================================

      - name: Verify Qt
        shell: powershell
        run: |
          Write-Host "QT6_DIR:"
          Write-Host $env:QT6_DIR

          if (!(Test-Path "$env:QT6_DIR\Qt6Config.cmake")) {
              Write-Error "Qt6Config.cmake no existe."
              exit 1
          }

          Write-Host ""
          Write-Host "Qt6Config.cmake encontrado correctamente."

      # ============================================================
      # Verificar CMake / Visual Studio
      # ============================================================

      - name: Verify Build Environment
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Build Environment"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Generadores Visual Studio:"
          cmake --help | Select-String "Visual Studio"

          Write-Host ""
          Write-Host "Visual Studio:"
          & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -property installationPath
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
              $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }

          if (Test-Path $vswhere) {
              & $vswhere -latest -products * -property installationPath
          } else {
              Write-Error "No se encontró vswhere.exe en ninguna de las rutas esperadas."
              exit 1
          }

      # ============================================================
      # Configure CMake
      # ============================================================

      - name: Configure CMake
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Configurando CMake"
          Write-Host "========================================"

          cmake -S . -B build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            "-DQt6_DIR=$env:QT6_DIR" `
            "-DCMAKE_INSTALL_PREFIX=build/install" `
            "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falló la configuración de CMake."
              exit $LASTEXITCODE
          }

      # ============================================================
      # Build
      # ============================================================

      - name: Build Release
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Compilando Release"
          Write-Host "========================================"

          cmake --build build `
            --config Release `
            --parallel

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falló la compilación."
              exit $LASTEXITCODE
          }

      # ============================================================
      # Install
      # ============================================================

      - name: Install Release
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Instalando Release"
          Write-Host "========================================"

          cmake --install build --config Release

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falló la instalación."
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Contenido de build/install:"
          Get-ChildItem `
            "${{ github.workspace }}\build\install" `
            -Recurse

      # ============================================================
      # CPack
      # ============================================================

      - name: Package with CPack
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Generando paquetes"
          Write-Host "========================================"

          cpack `
            --config "${{ github.workspace }}\build\CPackConfig.cmake" `
            -C Release

          if ($LASTEXITCODE -ne 0) {
              Write-Error "CPack falló."
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Artefactos generados:"

          $artifacts = Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -File |
            Where-Object {
                $_.Name -like "iptvPlus-*"
            }

          if (!$artifacts -or $artifacts.Count -eq 0) {
              Write-Error "CPack no generó ningún artefacto."
              exit 1
          }

          $artifacts | ForEach-Object {
              Write-Host $_.FullName
          }

      # ============================================================
      # CHANGELOG
      # ============================================================

      - name: Read CHANGELOG.md
        id: changelog
        shell: pwsh
        run: |
          if (Test-Path "CHANGELOG.md") {
              $content = Get-Content "CHANGELOG.md" -Raw

              "content<<EOF" >> $env:GITHUB_OUTPUT
              $content >> $env:GITHUB_OUTPUT
              "EOF" >> $env:GITHUB_OUTPUT
          }
          else {
              "content=Release ${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iptvPlus-*.exe
            iptvPlus-*.zip

          generate_release_notes: true

          body: |
            ${{ steps.changelog.outputs.content }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
